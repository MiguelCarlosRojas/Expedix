name: Publish Expedix Web to Docker Hub

on:
  push:
    branches:
      - feature/web
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and Publish Web Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Validate TypeScript and Build Vite
        run: |
          pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            miguelangelcr/expedix-ia:web
            miguelangelcr/expedix-ia:web-latest
            miguelangelcr/expedix-ia:web-sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Web Docker Hub Publication
        run: |
          echo "Web image successfully published to miguelangelcr/expedix-ia with tags: web, web-latest, web-sha-${{ github.sha }}"
