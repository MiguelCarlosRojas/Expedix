name: Publish Expedix API to Docker Hub

on:
  push:
    branches:
      - feature/api
  workflow_dispatch:

jobs:
  test-and-publish:
    name: Test and Publish API Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Integration Suite
        run: |
          pytest tests/test_full_system.py -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            miguelangelcr/expedix-ia:api
            miguelangelcr/expedix-ia:api-latest
            miguelangelcr/expedix-ia:api-sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify API Docker Hub Publication
        run: |
          echo "API image successfully published to miguelangelcr/expedix-ia with tags: api, api-latest, api-sha-${{ github.sha }}"
