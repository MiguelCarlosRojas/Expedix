<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <!-- Fondo verde redondeado veterinario -->
  <rect width="64" height="64" rx="16" fill="url(#vetGrad)" />

  <!-- Huella Veterinaria (Paw Pad) en Blanco Puro -->
  <!-- Almohadilla Principal -->
  <path d="M32 49 C24 49 19 43.5 19 37.5 C19 31.5 25 29 32 29 C39 29 45 31.5 45 37.5 C45 43.5 40 49 32 49 Z" fill="#ffffff" />

  <!-- Dedos de la Huella (4 Toes) -->
  <ellipse cx="19.5" cy="24.5" rx="4.2" ry="5.2" transform="rotate(-20 19.5 24.5)" fill="#ffffff" />
  <ellipse cx="27.5" cy="19.5" rx="4.2" ry="5.5" transform="rotate(-7 27.5 19.5)" fill="#ffffff" />
  <ellipse cx="36.5" cy="19.5" rx="4.2" ry="5.5" transform="rotate(7 36.5 19.5)" fill="#ffffff" />
  <ellipse cx="44.5" cy="24.5" rx="4.2" ry="5.2" transform="rotate(20 44.5 24.5)" fill="#ffffff" />

  <!-- Cruz Médica Veterinaria Embebida en la Almohadilla -->
  <rect x="29.5" y="34.5" width="5" height="11" rx="1.5" fill="#15803d" />
  <rect x="26.5" y="37.5" width="11" height="5" rx="1.5" fill="#15803d" />
</svg>
