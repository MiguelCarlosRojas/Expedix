apiVersion: v1
kind: Secret
metadata:
  name: expedix-secrets
  namespace: expedix
  labels:
    app.kubernetes.io/name: expedix
type: Opaque
stringData:
  # ATENCIÓN: Plantilla de ejemplo. Reemplace estos marcadores con los valores reales en su gestor de secretos o en producción.
  DJANGO_SECRET_KEY: "CAMBIAR_POR_UNA_CLAVE_ALEATORIA_Y_SEGURA_DE_PRODUCCION"
  DATABASE_URL: "postgresql://expedientes_user:PASSWORD_SEGURA@postgres-service:5432/expedientes_db"
  REDIS_URL: "redis://:PASSWORD_REDIS@redis-service:6379/0"
  CELERY_BROKER_URL: "redis://:PASSWORD_REDIS@redis-service:6379/1"
  CELERY_RESULT_BACKEND: "redis://:PASSWORD_REDIS@redis-service:6379/1"
  GOOGLE_SERVICE_ACCOUNT_FILE: "/etc/secrets/google/google_credentials.json"
