apiVersion: apps/v1
kind: Deployment
metadata:
  name: expedix-web
  namespace: expedix
  labels:
    app: expedix-web
    component: frontend
    app.kubernetes.io/name: expedix
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: expedix-web
  template:
    metadata:
      labels:
        app: expedix-web
        component: frontend
    spec:
      containers:
        - name: web
          image: docker.io/miguelangelcr/expedix-ia:web-latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "80"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
