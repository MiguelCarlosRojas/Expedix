apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: expedix-redis-pvc
  namespace: expedix
  labels:
    app.kubernetes.io/name: expedix
    app.kubernetes.io/component: cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expedix-redis
  namespace: expedix
  labels:
    app.kubernetes.io/name: expedix
    app.kubernetes.io/component: cache
    app: expedix-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: expedix-redis
  template:
    metadata:
      labels:
        app: expedix-redis
        app.kubernetes.io/name: expedix
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: expedix-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: expedix
  labels:
    app.kubernetes.io/name: expedix
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: expedix-redis
