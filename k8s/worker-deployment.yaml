apiVersion: apps/v1
kind: Deployment
metadata:
  name: expedix-celery-worker
  namespace: expedix
  labels:
    app: expedix-celery-worker
    component: worker
    app.kubernetes.io/name: expedix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expedix-celery-worker
  template:
    metadata:
      labels:
        app: expedix-celery-worker
        component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: docker.io/miguelangelcr/expedix-ia:api-latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "config", "worker", "-l", "INFO"]
          envFrom:
            - configMapRef:
                name: expedix-config
            - secretRef:
                name: expedix-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
